- date: '2026-08-19'
  title: 'Unktok Reviewer: what happens when careful reading stops being scarce'
  description: 'Peer review rations the one resource it runs on — hours of close reading
    — and then compresses what it spends into a verdict. Our reviewer issues no verdict
    at all: it reads an arXiv paper end to end and returns findings, the evidence
    behind each one, and the work that would close the gaps. It''s free, and it''s
    live.'
  url: https://unktok.com/blog/unktok-review.html
