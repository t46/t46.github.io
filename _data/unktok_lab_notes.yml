  title: 'Atlas of Judgment: nine years of peer review, read one unit of reasoning
    at a time'
  description: Two reviewers write 5. One means the idea is not new; the other means
    the experiments do not support the claim. A score is a judgment with the reasons
    thrown away — so we kept the reasons. Every public ICLR review from 2018 to 2026,
    read into 1,009,592 units of evaluative logic and charted across thirty plates.
  url: https://unktok.com/blog/atlas-of-judgment.html
