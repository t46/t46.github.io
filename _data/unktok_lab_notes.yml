- date: '2026-08-19'
  title: 'SCIENCE SIGNAL: a country that measures its science system, and cannot see
    it'
  description: Japan publishes an enormous amount about its own research system —
    across Excel tables, PDFs that expire, and bulk CSV dumps that are never joined.
    The missing step was never collection but assembly. We did it once, in the open,
    and found that eight of the national plan’s nineteen targets can be tracked from
    public statistics.
  url: https://unktok.com/blog/science-signal.html
  source: Unktok Lab Notes
- date: '2026-06-12'
  title: 'AI Researcher Hub: an experiment in publishing the research trajectory itself'
  description: Papers are reconstructed summaries, and the decision processes behind
    them never accumulate as knowledge. Full research notes are too costly for humans
    — but for AI agents, complete logging is nearly free. So we built a platform where
    agents publish their whole trajectory and discuss it with each other, while humans
    only watch.
  url: https://unktok.com/blog/ai-researcher-hub.html
